services:
  project-data-init:
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["python", "-m", "app.db.prepare_project_data"]
    environment:
      PROJECT_DATA_DIRECTORY: /app/data
      LEGACY_DATABASE_DIRECTORY: /legacy
      GOLD_DATABASE_PATH: /workspace/cinerocket.db
      GOLD_DATABASE_FINGERPRINT_PATH: /workspace/cinerocket.db.sha256
    volumes:
      - ./data:/app/data
      - cinedata-db:/legacy:ro
      - type: bind
        source: ./data/cinerocket.db
        target: /workspace/cinerocket.db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/cinerocket.db.sha256
        target: /workspace/cinerocket.db.sha256
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  backend:
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: sqlite+aiosqlite:////app/data/rocketlab.db
      GOLD_DATABASE_PATH: /workspace/cinerocket.db
      GOLD_DATABASE_FINGERPRINT_PATH: /workspace/cinerocket.db.sha256
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:8080"]'
      LOG_LEVEL: INFO
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cinedata-demo-local-only-change-before-deploy}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      INITIAL_ADMIN_EMAIL: admin@admin.com
      INITIAL_ADMIN_NAME: admin
      INITIAL_ADMIN_PASSWORD: admin123
    volumes:
      - ./data:/app/data
      - type: bind
        source: ./data/cinerocket.db
        target: /workspace/cinerocket.db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/cinerocket.db.sha256
        target: /workspace/cinerocket.db.sha256
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      project-data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45m

  genai:
    pull_policy: build
    build:
      context: .
      dockerfile: genai/Dockerfile
    env_file:
      - path: ./genai/.env
        required: false
    environment:
      GENAI_GOLD_DATABASE_PATH: /gold-cache/cinerocket.db
      GENAI_GOLD_SOURCE_PATH: /workspace/cinerocket.db
      GENAI_GOLD_FINGERPRINT_PATH: /workspace/cinerocket.db.sha256
      GENAI_GOLD_TIMEOUT_SECONDS: 5
      GENAI_GOLD_COMPLEX_TIMEOUT_SECONDS: 15
      GENAI_GOLD_PAIR_QUERY_TIMEOUT_SECONDS: 45
      GENAI_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - genai-gold:/gold-cache
      - type: bind
        source: ./data/cinerocket.db
        target: /workspace/cinerocket.db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/cinerocket.db.sha256
        target: /workspace/cinerocket.db.sha256
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      project-data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_GENAI_API_BASE_URL: http://localhost:8001/api/v1
        VITE_DEMO_MODE: "true"
    depends_on:
      backend:
        condition: service_healthy
      genai:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cinedata-db:
    name: cinedata-analytics-fullstack_cinedata-db
  genai-gold:
