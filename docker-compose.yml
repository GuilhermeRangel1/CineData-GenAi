services:
  project-data-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["python", "-m", "app.db.prepare_project_data"]
    environment:
      PROJECT_DATA_DIRECTORY: /app/data
      LEGACY_DATABASE_DIRECTORY: /legacy
      GOLD_DATABASE_PATH: /workspace/cinerocket.db
    volumes:
      - ./data:/app/data
      - cinedata-db:/legacy:ro
      - type: bind
        source: ./data/cinerocket.db
        target: /workspace/cinerocket.db
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: sqlite+aiosqlite:////app/data/rocketlab.db
      GOLD_DATABASE_PATH: /workspace/cinerocket.db
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:8080"]'
      LOG_LEVEL: INFO
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cinedata-demo-local-only-change-before-deploy}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      INITIAL_ADMIN_EMAIL: admin@admin.com
      INITIAL_ADMIN_NAME: admin
      INITIAL_ADMIN_PASSWORD: admin123
    volumes:
      - ./data:/app/data
      - type: bind
        source: ./data/cinerocket.db
        target: /workspace/cinerocket.db
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      project-data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_DEMO_MODE: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cinedata-db:
    name: cinedata-analytics-fullstack_cinedata-db
